services:
  - type: web
    name: saas-estetica-sena
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: WOMPI_PUBLIC_KEY
        sync: false
      - key: WOMPI_PRV_KEY
        sync: false
      - key: WOMPI_INTEGRITY_KEY
        sync: false
      - key: WOMPI_EVENTS_KEY
        sync: false
